<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- EDIT: 2-4 word title, and one-sentence description -->
<title>Langfuse Prompts and Tracing</title>
<meta name="description" content="Narrated, beginner-friendly walkthrough of how Place Discover loads every prompt from Langfuse and sends traces and sessions to Langfuse.">
<style>
/* =====================================================================
   ENGINE STYLES: normally no need to edit. Colours are tokens; dark mode
   is automatic. --c1..--c5 are the "packet" colours used by LEGEND.
   ===================================================================== */
:root {
  --bg: #f6f7fb; --panel: #ffffff; --ink: #1b2030; --muted: #5d6478; --line: #c9cedb;
  --comp: #ffffff; --group: #eef1f8; --accent: #4f6bff; --accent-soft: rgba(79,107,255,.14);
  --c1: #64708a; --c2: #3d7bff; --c3: #9b5cf6; --c4: #e8961c; --c5: #16a38a;
  --ok: #16a34a; --bad: #e5484d; --code-bg: #f1f3f9;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --panel: #171b24; --ink: #e7eaf2; --muted: #98a0b5; --line: #353c4d;
    --comp: #1d2230; --group: #141821; --accent: #7d93ff; --accent-soft: rgba(125,147,255,.18);
    --c1: #8d97ad; --c2: #6b9bff; --c3: #b48cff; --c4: #f3ad48; --c5: #34c9ac;
    --ok: #3ccf73; --bad: #ff6b6f; --code-bg: #10141c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --panel: #171b24; --ink: #e7eaf2; --muted: #98a0b5; --line: #353c4d;
  --comp: #1d2230; --group: #141821; --accent: #7d93ff; --accent-soft: rgba(125,147,255,.18);
  --c1: #8d97ad; --c2: #6b9bff; --c3: #b48cff; --c4: #f3ad48; --c5: #34c9ac;
  --ok: #3ccf73; --bad: #ff6b6f; --code-bg: #10141c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, pre, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
header h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -.01em; }
header p { margin: 0; color: var(--muted); }
.top { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.theme-btn { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }

/* stage + diagram */
.stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage svg { display: block; width: 100%; height: auto; }
.stage-scroll { overflow-x: auto; }
@media (max-width: 700px) { .stage-scroll svg { min-width: 760px; } }
.container rect { fill: var(--group); stroke: var(--line); stroke-dasharray: 5 4; }
.container .ct { font-size: 14px; font-weight: 650; fill: var(--ink); }
.container .cs { font-size: 11px; fill: var(--muted); }
.node rect { fill: var(--comp); stroke: var(--line); stroke-width: 1.3; transition: stroke .3s, fill .3s; }
.node .t1 { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.node .t2 { font-size: 10.5px; fill: var(--muted); }
.node, .container, .wire { transition: opacity .45s; }
.node.ext rect { fill: var(--group); }
.sec { font-size: 10.5px; font-weight: 700; fill: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.dim { opacity: .18; }
.node.hot rect { stroke: var(--accent); stroke-width: 2.6; fill: var(--accent-soft); }
.container.hot rect { stroke: var(--accent); stroke-width: 2; }
.node.flash rect { animation: flash .9s ease-out; }
@keyframes flash { 0% { stroke-width: 5; stroke: var(--accent); } 100% { stroke-width: 2.6; } }
.node.off rect { stroke-dasharray: 3 3; fill: transparent; }
.node.off .t1, .node.off .t2 { fill: var(--muted); text-decoration: line-through; }
.container.sleep rect { fill: transparent; stroke: var(--muted); }
.slot { fill: transparent; stroke: var(--line); }
.slot.filled { fill: var(--c2); stroke: var(--c2); }
.wire { fill: none; stroke: var(--line); stroke-width: 1.6; }
.wire.live { stroke: var(--accent); stroke-dasharray: 7 6; animation: flow .9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -26; } }
.pk-label { font-size: 10.5px; font-weight: 650; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
.badge { font-size: 12px; font-weight: 700; }
body.paused *, body.paused *::before { animation-play-state: paused !important; }

/* captions */
.caption { border-top: 1px solid var(--line); padding: 12px 18px 14px; min-height: 92px; }
.caption .speaker { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
.wave { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.wave i { width: 3px; background: var(--accent); border-radius: 2px; height: 4px; }
.speaking .wave i { animation: wave .9s ease-in-out infinite; }
.speaking .wave i:nth-child(2) { animation-delay: .15s; } .speaking .wave i:nth-child(3) { animation-delay: .3s; } .speaking .wave i:nth-child(4) { animation-delay: .45s; }
@keyframes wave { 0%,100% { height: 3px; } 50% { height: 12px; } }
#capText { font-size: 17px; line-height: 1.5; margin-top: 4px; }
.term { display: none; margin-top: 8px; font-size: 13.5px; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 6px; padding: 6px 10px; }
.term.show { display: block; animation: fadein .4s; }
.term b { color: var(--accent); }

/* start overlay */
.overlay { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px;
  background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(4px); }
.overlay.gone { display: none; }
.overlay .box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px 26px; max-width: 460px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
.overlay h2 { margin: 0 0 6px; font-size: 21px; }
.overlay p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.overlay button { display: block; width: 100%; margin: 8px 0; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--comp); color: var(--ink); }
.overlay button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.overlay small { color: var(--muted); font-size: 12px; }
.devwarn { display: none; margin-top: 10px; color: var(--bad); font-size: 12.5px; text-align: left; white-space: pre-wrap; }

/* player */
.player { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.player button, .player select { background: var(--comp); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; height: 34px; min-width: 38px; font-size: 15px; cursor: pointer; }
.player select { font-size: 13px; max-width: 220px; }
.player button.primary { background: var(--accent); color: #fff; border-color: var(--accent); min-width: 46px; }
.bar { flex: 1 1 260px; display: flex; gap: 3px; min-width: 200px; }
.seg { flex: 1; height: 8px; border-radius: 4px; background: var(--line); cursor: pointer; position: relative; overflow: hidden; }
.seg i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
.clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 54px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; background: var(--c); }

/* chapter text + detail panel */
.below { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; margin-top: 16px; }
@media (max-width: 900px) { .below { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.kicker { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
#sTitle { margin: 4px 0 10px; font-size: 21px; line-height: 1.25; }
#sBody p { margin: 0 0 10px; }
#sBody ul { margin: 0 0 10px; padding-left: 20px; }
.codefile { display: inline-block; font-size: 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; margin: 2px 4px 2px 0; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; line-height: 1.5; overflow-x: auto; margin: 10px 0 0; }
.hl { background: var(--accent-soft); border-radius: 3px; }
.dt { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
h3 { margin: 0 0 10px; font-size: 15px; }
.gloss { margin-top: 16px; }
.gloss dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 16px; margin: 0; }
.gloss dl div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; animation: fadein .5s; }
.gloss dt { font-weight: 700; color: var(--accent); }
.gloss dd { margin: 2px 0 0; color: var(--ink); }
.gloss .empty { color: var(--muted); font-size: 13.5px; }

/* reusable panel widgets (see SKILL.md "Panel widgets") */
.wf { font-size: 12.5px; }
.wf-row { display: grid; grid-template-columns: 230px 1fr 56px; gap: 8px; align-items: center; height: 26px; opacity: 0; transform: translateY(4px); transition: opacity .35s, transform .35s; }
.wf-row.show { opacity: 1; transform: none; }
.wf-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-track { position: relative; height: 12px; background: var(--code-bg); border-radius: 3px; }
.wf-bar { position: absolute; top: 0; bottom: 0; border-radius: 3px; width: 0; transition: width .7s ease-out; }
.wf-ms { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .wf-row { grid-template-columns: 150px 1fr 48px; } }
.cards3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 640px) { .cards3 { grid-template-columns: 1fr; } }
.mini { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; transition: background .3s, border-color .3s, transform .3s; }
.mini b { display: block; margin-bottom: 3px; }
.mini.on { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-2px); }
.mini .eg { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
.steps li { counter-increment: s; padding: 7px 10px 7px 38px; position: relative; border-radius: 8px; color: var(--muted); transition: background .3s, color .3s; font-size: 13.5px; }
.steps li::before { content: counter(s); position: absolute; left: 10px; top: 7px; width: 20px; height: 20px; border-radius: 50%; background: var(--line); color: var(--panel); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.steps li.on { background: var(--accent-soft); color: var(--ink); }
.steps li.on::before { background: var(--accent); color: #fff; }
.tl { display: flex; flex-wrap: wrap; }
.tl div { flex: 1 1 110px; border-top: 4px solid var(--line); padding: 8px 6px 0 0; font-size: 12.5px; color: var(--muted); transition: border-color .3s, color .3s; }
.tl div.on { border-color: var(--accent); color: var(--ink); }
.tl b { display: block; font-size: 12px; }
.url { font-size: 12.5px; word-break: break-all; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 4px 0 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.num { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.bump { animation: bump .5s; }
@keyframes bump { 0% { color: var(--c4); transform: scale(1.25); } 100% { transform: none; } }
.logs { font-size: 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 96px; margin-top: 10px; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: fadein .4s; }
.status { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.status.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.status.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.alert { border: 1px solid var(--bad); border-radius: 10px; padding: 10px 12px; font-size: 13px; opacity: 0; transition: opacity .4s; }
.alert.on { opacity: 1; }
.hidden { visibility: hidden; }
@keyframes fadein { from { opacity: 0; } }

/* EDIT (optional): styles for your own panel widgets go here */
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <header>
      <h1 id="hTitle"></h1>
      <p id="hSub"></p>
    </header>
    <button class="theme-btn" id="themeBtn" type="button">◐ Theme</button>
  </div>

  <div class="stage">
    <div class="overlay" id="overlay">
      <div class="box">
        <h2 id="oTitle"></h2>
        <p id="oSub"></p>
        <button class="primary" id="startVoice" type="button">▶ Play with voice narration</button>
        <button id="startSilent" type="button">Play silently (subtitles only)</button>
        <small>The voice is your browser's built-in speech engine. It sounds best in Microsoft Edge (Natural voices) or Chrome.</small>
        <div class="devwarn" id="devwarn"></div>
      </div>
    </div>
    <div class="stage-scroll"><svg id="svg" viewBox="0 0 1200 650" role="img" aria-label="Animated diagram"></svg></div>
    <div class="caption" id="caption" aria-live="polite">
      <div class="speaker"><span class="wave"><i></i><i></i><i></i><i></i></span><span id="spk">Narrator</span></div>
      <div id="capText">Press play to start.</div>
      <div class="term" id="term"></div>
    </div>
    <div class="player">
      <button id="prev" title="Previous chapter (←)">⏮</button>
      <button id="play" class="primary" title="Play / pause (space)">▶</button>
      <button id="next" title="Next chapter (→)">⏭</button>
      <button id="replay" title="Replay chapter (R)">↺</button>
      <button id="voiceBtn" title="Voice on / off (V)">🔊</button>
      <div class="bar" id="bar"></div>
      <span class="clock" id="clock"></span>
      <select id="speed" title="Speed">
        <option value="0.75">0.75×</option><option value="0.9">0.9×</option>
        <option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
      </select>
      <select id="voiceSel" title="Narrator voice"></select>
    </div>
    <div class="player" style="padding-top:0;border-top:0"><div class="legend" id="legend"></div></div>
  </div>

  <div class="below">
    <div class="card">
      <div class="kicker" id="sKicker"></div>
      <h2 id="sTitle"></h2>
      <div id="sBody"></div>
    </div>

  </div>

  <div class="card gloss">
    <h3>📘 Words explained so far</h3>
    <dl id="gloss"><span class="empty">Terms appear here as the narrator explains them.</span></dl>
  </div>
</div>

<script>
/* #####################################################################
   ENGINE: do not edit (virtual clock, voice, SVG + animation helpers,
   captions, glossary, player). Your content goes in the two EDIT
   sections further down: DIAGRAM and SCENES.
   ##################################################################### */

/* ---- virtual clock: animations run on vt; it stops while paused, scales with speed ---- */
let vt = 0, last = performance.now(), paused = true, speed = 1;
let waiters = [];
const anims = new Set();
function loop(now) {
  const dt = Math.min(now - last, 100); last = now;
  if (!paused) vt += dt * speed;
  for (const a of [...anims]) a(vt);
  for (let i = waiters.length - 1; i >= 0; i--) if (vt >= waiters[i].t) waiters.splice(i, 1)[0].res();
  updateBar();
  requestAnimationFrame(loop);
}
const wait = ms => new Promise(res => waiters.push({ t: vt + ms, res }));
const CANCEL = Symbol("cancel");
let tok = 0;
const guard = t => { if (t !== tok) throw CANCEL; };
const w = async (ms, t) => { await wait(ms); guard(t); };
const $ = id => document.getElementById(id);

/* ---- voice: Web Speech API, spoken sentence by sentence ---- */
const synth = window.speechSynthesis || null;
let voiceOn = true, voice = null, curSpeech = null;
const keepAlive = [];   // Chrome drops onend of garbage-collected utterances
function pickVoices() {
  if (!synth) { $("voiceSel").style.display = "none"; return; }
  const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
  if (!vs.length) return;
  const prefs = [/natural/i, /Google US English/i, /Google UK English Female/i, /Aria|Jenny|Guy|Zira|Samantha/i, /en-IN/i, /en-US/i];
  let best = null;
  for (const re of prefs) { best = vs.find(v => re.test(v.name) || re.test(v.lang)); if (best) break; }
  const sel = $("voiceSel"), keep = voice ? voice.name : null;
  sel.innerHTML = vs.map(v => `<option value="${v.name}">${v.name.replace(/Microsoft |Online |\(Natural\)/g, "").trim()} · ${v.lang}</option>`).join("");
  voice = vs.find(v => v.name === keep) || best || vs[0];
  sel.value = voice.name;
}
if (synth) { pickVoices(); synth.onvoiceschanged = pickVoices; }
$("voiceSel").onchange = e => { voice = synth.getVoices().find(v => v.name === e.target.value) || voice; };
function setSpeaking(on) { $("caption").classList.toggle("speaking", on); }
function utter(sp) {
  const u = new SpeechSynthesisUtterance(sp.parts[sp.i]);
  if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-US";
  u.rate = Math.max(.6, Math.min(1.8, speed)) * 0.97;
  const done = () => {
    if (sp.u !== u || sp.stopped || sp.finished) return;
    sp.i++;
    if (sp.i < sp.parts.length) utter(sp); else finishSpeech(sp);
  };
  u.onend = done; u.onerror = done;
  sp.u = u; keepAlive.push(u); if (keepAlive.length > 30) keepAlive.shift();
  synth.speak(u); setSpeaking(true);
}
function finishSpeech(sp) {
  if (sp.finished) return;
  sp.finished = true; sp.stopped = true;
  if (curSpeech === sp) curSpeech = null;
  setSpeaking(false); sp.res();
}
function speak(text) {
  const words = text.split(/\s+/).length;
  if (!voiceOn || !synth) return wait(Math.max(1600, words * 300));     // subtitles-only reading pace
  return new Promise(res => {
    const sp = { parts: text.match(/[^.!?]+[.!?]*\s*/g) || [text], i: 0, res, stopped: false, finished: false };
    curSpeech = sp;
    if (!paused) utter(sp);
    wait(words * 900 + 6000).then(() => { if (!sp.finished) { synth.cancel(); finishSpeech(sp); } });  // safety net
  });
}
function stopSpeech() {
  if (curSpeech) { curSpeech.stopped = true; curSpeech.finished = true; curSpeech = null; }
  if (synth && (synth.speaking || synth.pending)) synth.cancel();
  setSpeaking(false);
}

/* ---- SVG builders ---- */
const NS = "http://www.w3.org/2000/svg";
const svg = $("svg");
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, x, y, s, cls, anchor) {
  const t = el("text", { x, y, class: cls }, parent);
  if (anchor) t.setAttribute("text-anchor", anchor);
  t.textContent = s; return t;
}
const LAYER = { cont: el("g", {}, svg), wires: el("g", {}, svg), nodes: el("g", {}, svg), packets: el("g", {}, svg) };
/** Dashed group box with a title at top-left (e.g. "Cloud server"). */
function container(id, x, y, w, h, title, sub) {
  const g = el("g", { id, class: "container" }, LAYER.cont);
  el("rect", { x, y, width: w, height: h, rx: 14 }, g);
  txt(g, x + 16, y + 24, title, "ct");
  if (sub) txt(g, x + 16, y + 40, sub, "cs");
  return g;
}
/** Component box with centred title (+ optional subtitle). kind "ext" = outside system. */
function box(id, x, y, w, h, title, sub, kind = "") {
  const g = el("g", { id, class: "node " + kind }, LAYER.nodes);
  el("rect", { x, y, width: w, height: h, rx: 8 }, g);
  if (title) txt(g, x + w / 2, sub ? y + h / 2 - 2 : y + h / 2 + 4, title, "t1", "middle");
  if (sub) txt(g, x + w / 2, y + h / 2 + 13, sub, "t2", "middle");
  return g;
}
/** Panel-like node with title at top-left, for grouping smaller boxes inside it. */
function panel(id, x, y, w, h, title, sub) {
  const g = el("g", { id, class: "node" }, LAYER.nodes);
  el("rect", { x, y, width: w, height: h, rx: 10 }, g);
  txt(g, x + 14, y + 21, title, "t1");
  if (sub) txt(g, x + w - 14, y + 21, sub, "t2", "end");
  return g;
}
/** Box with 8 "slots" that fill up (queues, buffers, batches). Use fill(id, n). */
function slotBox(id, x, y, w, h, title) {
  const g = el("g", { id, class: "node" }, LAYER.nodes);
  el("rect", { x, y, width: w, height: h, rx: 8 }, g);
  txt(g, x + 12, y + 18, title, "t1");

/** Section label inside a panel. */
function label(x, y, s) { return txt(LAYER.nodes, x, y, s, "sec"); }
/** Connector path; packets travel along it. Use SVG path syntax (M x,y L x,y or C curves). */
function wire(id, d) { return el("path", { id: "w_" + id, d, class: "wire" }, LAYER.wires); }

/* ---- animation helpers ---- */
let COLORS = {};
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
/** Move a dot (or big=true: a box) of colour `kind` along wire `path`. Resolves on arrival. */
function packet(path, kind, opts = {}) {
  const { label = "", dur = 1100, r = 7, reverse = false, big = false } = opts;
  const p = $("w_" + path);
  if (!p) { console.warn("packet: no wire named", path); return Promise.resolve(); }
  const L = p.getTotalLength(), g = el("g", {}, LAYER.packets);
  if (big) el("rect", { x: -16, y: -9, width: 32, height: 18, rx: 4, fill: COLORS[kind] }, g);
  else el("circle", { r, fill: COLORS[kind] }, g);
  if (label) { const t = txt(g, 0, -13, label, "pk-label", "middle"); t.setAttribute("fill", COLORS[kind]); }
  p.classList.add("live");
  const t0 = vt;
  return new Promise(res => {
    const f = t => {
      const q = Math.min(1, (t - t0) / dur), e = ease(q);
      const pt = p.getPointAtLength(L * (reverse ? 1 - e : e));
      g.setAttribute("transform", `translate(${pt.x},${pt.y})`);
      if (q >= 1) { anims.delete(f); g.remove(); res(); }
    };
    anims.add(f); f(vt);
  });
}
const go = async (t, ...a) => { await packet(...a); guard(t); };          // one packet, then continue
const all = async (t, ...ps) => { await Promise.all(ps); guard(t); };      // several packets at once
const ALL_NODES = () => [...document.querySelectorAll(".node, .container")];
/** Spotlight: dim everything except these node ids and these wire names. */
function focus(ids, wires = []) {
  const keep = new Set(ids);
  ALL_NODES().forEach(n => n.classList.toggle("dim", !keep.has(n.id)));
  document.querySelectorAll(".wire").forEach(p => p.classList.toggle("dim", !wires.includes(p.id.slice(2))));
}
function unfocus() { ALL_NODES().forEach(n => n.classList.remove("dim")); document.querySelectorAll(".wire").forEach(p => p.classList.remove("dim")); }
function hot(...ids) { ids.forEach(id => { const n = $(id); if (!n) return console.warn("hot: no node", id); n.classList.add("hot", "flash"); setTimeout(() => n.classList.remove("flash"), 900); }); }
function cool(...ids) { ids.forEach(id => $(id)?.classList.remove("hot")); }
function fill(id, n) { for (let i = 0; i < 8; i++) $(`${id}_s${i}`).classList.toggle("filled", i < n); }
const on = (id, v = true) => $(id).classList.toggle("on", v);           // highlight a .mini card etc.
/** Waterfall row in a <div class="wf" id="wf"> panel: name, indent depth, start %, width %, label, colour kind. */

const learned = new Set();
function showCaption(line) {
  $("capText").textContent = line.say;
  const term = $("term");
  if (line.term) {
    term.innerHTML = `📘 <b>${line.term[0]}</b>: ${line.term[1]}`;

}

{

      wfRow("ChatGroq · review-extractor v1 ×3", 3, 40, 18, "1.1 s", "ai"); cool("n_fetch"); });

{

  body: `<p>SerpStack and WebScraping.AI take the API key <b>in the web address</b>, and the SMS library puts the phone number and the message there too.</p>

  <p>Prompts and AI answers are still stored in Langfuse, including the SMS negotiation text, because that is the point of AI tracing.</p>
  <span class="codefile">app/telemetry.py · _redact_request_hook</span>`,

  <div class="dt">What is stored on the span in Langfuse:</div>

{
  title: "Spans wait in a buffer, then ship to Langfuse",
  body: `<p>Finished spans go into an in-memory <b>buffer</b> (<code>BatchSpanProcessor</code>). About every 5 seconds, or when many are waiting, they are sent together as one <b>batch</b>.</p>
  <p>The <b>OTLP exporter</b> sends the batch to <code>&lt;LANGFUSE_HOST&gt;/api/public/otel/v1/traces</code>, logging in with your public and secret key. Langfuse stores the spans as traces, grouped into sessions.</p>
  <p>All of this runs in the background: users never wait for Langfuse, and if Langfuse is down the app keeps working.</p>`,
  panel: `<h3>From span to Langfuse</h3>
  <div class="tl">
    <div><b>1 · span ends</b>joins the buffer</div>
    <div><b>2 · ~5 s or full</b>batch is ready</div>
    <div><b>3 · OTLP</b>one secure web request</div>
    <div><b>4 · Langfuse</b>traces + sessions</div>
  </div>
<pre>POST https://us.cloud.langfuse.com/api/public/otel/v1/traces
Authorization: Basic &lt;public key : secret key&gt;
Content-Type: application/x-protobuf</pre>`,
  lines: [
    { say: "Finished spans are not sent one by one. They wait in a buffer, which is a small waiting area in the app's memory.",
      term: ["Buffer", "A small temporary waiting area in memory, where data sits for a few seconds before it is sent."] },
    { say: "About every five seconds, or when many spans are waiting, they are sent in one go. Sending many items together like this is called a batch.",
      term: ["Batch", "Many items sent together in one go, instead of one by one."] },
    { say: "The exporter sends the batch using O T L P, the OpenTelemetry protocol. A protocol is an agreed message format that both sides understand.",
      term: ["OTLP and protocol", "A protocol is an agreed message format. OTLP is OpenTelemetry's standard format for sending traces."] },
    { say: "Langfuse checks your public and secret keys, then stores the spans as traces, grouped into sessions." },
    { say: "This all happens in the background, so your users never wait for Langfuse. And if Langfuse is down, the app keeps working." },
  ],
  async run(t) {
    focus(["render", "sdk", "tagger", "buf", "exporter", "langfuse", "lf_ep", "lf_trace", "lf_sess"], ["tag_buf", "buf_exp", "exp_lf", "ep_trace", "trace_sess"]);
    await seg(t, 0, async () => { stepOn(0); for (let i = 1; i <= 5; i++) { await go(t, "tag_buf", "span", { dur: 450 }); fill("buf", i); } });
    await seg(t, 1, async () => { stepOn(1); for (let i = 6; i <= 8; i++) { await go(t, "tag_buf", "span", { dur: 400 }); fill("buf", i); } hot("buf"); await w(500, t); fill("buf", 0);
      await go(t, "buf_exp", "span", { big: true, dur: 600 }); hot("exporter"); });
    await seg(t, 2, async () => { stepOn(2); await go(t, "exp_lf", "span", { big: true, label: "OTLP batch", dur: 2200 }); hot("lf_ep"); });
    await seg(t, 3, async () => { stepOn(3); await go(t, "ep_trace", "span", { dur: 600 }); hot("lf_trace"); tr[0].textContent = "POST /agent/start · 1.9 s";
      await go(t, "trace_sess", "session", { dur: 600 }); hot("lf_sess"); ss[0].textContent = "session 3f2b8c1e… · 1 trace"; });
    await seg(t, 4, async () => { focus(["render", "browser", "fastapi"], ["req"]); await go(t, "req", "req", { label: "users keep going", dur: 1500 }); });
  }
},

  panel: `<h3>Shutdown sequence</h3>

    <div><b>1 · idle</b>~15 min, no visitors</div>
    <div><b>2 · stop signal</b>from Render</div>
    <div><b>3 · flush</b>buffer → Langfuse</div>
    <div><b>4 · sleep</b>💤 nothing lost</div>
  </div>`,
  lines: [

    { say: "Then it sleeps, and nothing is lost. The next visitor wakes it up, and the prompts are loaded again." },

    await seg(t, 0, async () => { stepOn(0); renderStatus.textContent = "idle…"; });
    await seg(t, 1, async () => { stepOn(1); renderStatus.textContent = "⚠ stop signal"; hot("render", "buf"); });
    await seg(t, 2, async () => { stepOn(2); fill("buf", 0); await go(t, "buf_exp", "span", { big: true, dur: 500 }); await go(t, "exp_lf", "span", { big: true, label: "last 5 spans", dur: 1800 }); hot("lf_ep"); });
    await seg(t, 3, async () => { stepOn(3); cool("render", "buf"); $("render").classList.add("sleep"); renderStatus.textContent = "💤 sleeping"; });
  }
},

/* #####################################################################
   PLAYER: do not edit
   ##################################################################### */
COLORS = Object.fromEntries(LEGEND.map(([k, , c]) => [k, c]));
$("legend").innerHTML = LEGEND.map(([, name, c]) => `<span style="--c:${c}">${name}</span>`).join("");
const totalWords = SCENES.reduce((n, s) => n + s.lines.reduce((m, l) => m + l.say.split(/\s+/).length, 0), 0);
$("hTitle").textContent = META.title; $("hSub").textContent = META.subtitle;
$("oTitle").textContent = META.overlayTitle || META.title;
$("oSub").textContent = `${SCENES.length} short chapters, about ${Math.max(1, Math.round(totalWords / 150))} min at 1×. Every technical word is explained as it comes up.`;

// Dev check: every line spoken exactly once, in order
(() => {
  const problems = [];
  SCENES.forEach((s, i) => {
    const used = [...s.run.toString().matchAll(/seg\(t,\s*(\d+)/g)].map(m => +m[1]);
    const want = s.lines.map((_, k) => k);
    if (used.join() !== want.join()) problems.push(`Chapter ${i + 1}: seg indices [${used}] but lines are [${want}]`);
    s.lines.forEach((l, k) => { if (/[_`{}<>]|\b[a-z]+[A-Z]\w*\(/.test(l.say)) problems.push(`Chapter ${i + 1} line ${k}: "say" contains code-like text (use plain spoken words)`); });
  });
  if (problems.length) { console.warn(problems.join("\n")); $("devwarn").style.display = "block"; $("devwarn").textContent = "⚠ Author check:\n" + problems.join("\n"); }
})();

let cur = 0;
const bar = $("bar");
SCENES.forEach((s, i) => {
  const d = document.createElement("div");
  d.className = "seg"; d.title = `${i + 1}. ${s.title}`; d.innerHTML = "<i></i>";
  d.onclick = () => { hideOverlay(); runScene(i); };
  bar.appendChild(d);
});
function updateBar() {
  const n = SCENES[cur].lines.length;
  const within = sceneDone ? 1 : Math.min(1, (segIdx + Math.min(1, (vt - segStart) / segEst)) / n);
  [...bar.children].forEach((d, i) => { d.firstChild.style.width = ((i < cur ? 1 : i > cur ? 0 : within) * 100) + "%"; });
}
async function runScene(i) {
  if (i < 0 || i >= SCENES.length) return;
  tok++; const t = tok; cur = i; segIdx = 0; segStart = vt; sceneDone = false;
  reset();
  const s = SCENES[i];
  $("sKicker").textContent = `Chapter ${i + 1} of ${SCENES.length}`;
  $("sTitle").textContent = s.title; $("sBody").innerHTML = s.body; $("detail").innerHTML = s.panel;
  $("clock").textContent = `${i + 1} / ${SCENES.length}`;
  try {
    await s.run(t);
    sceneDone = true;
    await w(1400, t);
    if (i + 1 < SCENES.length) runScene(i + 1);
    else { setPaused(true); $("capText").textContent = "The end. Click any chapter in the bar, or press ↺ to replay."; $("term").classList.remove("show"); }
  } catch (e) { if (e !== CANCEL) console.error(e); }
}
function setPaused(p) {
  paused = p;
  document.body.classList.toggle("paused", p);
  $("play").textContent = p ? "▶" : "⏸";
  if (!synth || !curSpeech) return;
  if (p) { curSpeech.stopped = true; curSpeech.u = null; synth.cancel(); setSpeaking(false); }
  else if (!curSpeech.finished) { curSpeech.stopped = false; utter(curSpeech); }
}
function setVoice(v) {
  voiceOn = v && !!synth;
  $("voiceBtn").textContent = voiceOn ? "🔊" : "🔇";
  $("spk").textContent = voiceOn ? "Narrator" : "Subtitles";
  if (!voiceOn && curSpeech) { const sp = curSpeech; synth.cancel(); finishSpeech(sp); }
}
function hideOverlay() { if (!$("overlay").classList.contains("gone")) { $("overlay").classList.add("gone"); setPaused(false); } }
function start(withVoice) { setVoice(withVoice); $("overlay").classList.add("gone"); setPaused(false); runScene(0); }
$("startVoice").onclick = () => start(true);
$("startSilent").onclick = () => start(false);
$("play").onclick = () => {
  if (!$("overlay").classList.contains("gone")) { start(voiceOn); return; }
  if (paused && cur === SCENES.length - 1 && sceneDone) { setPaused(false); runScene(0); return; }
  setPaused(!paused);
};
$("next").onclick = () => { hideOverlay(); runScene(Math.min(cur + 1, SCENES.length - 1)); };
$("prev").onclick = () => { hideOverlay(); runScene(Math.max(cur - 1, 0)); };
$("replay").onclick = () => { hideOverlay(); runScene(cur); };
$("voiceBtn").onclick = () => setVoice(!voiceOn);
$("speed").onchange = e => { speed = +e.target.value; };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === "r" || e.key === "R") $("replay").click();
  if (e.key === "v" || e.key === "V") $("voiceBtn").click();
});
$("themeBtn").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
if (!synth) { $("startVoice").textContent = "Voice not supported in this browser"; $("startVoice").disabled = true; setVoice(false); }
(() => { const s = SCENES[0]; $("sKicker").textContent = `Chapter 1 of ${SCENES.length}`; $("sTitle").textContent = s.title; $("sBody").innerHTML = s.body; $("detail").innerHTML = s.panel; $("clock").textContent = `1 / ${SCENES.length}`; reset(); })();
requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });
</script>
