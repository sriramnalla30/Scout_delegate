.dot.ok{background:var(--brand)}.dot.ask{background:var(--amber)}.dot.bad{background:var(--rose)}.dot.neutral{background:#94a3b8}
.pbtn.reset{border-style:dashed;color:var(--muted)}
.stage{max-width:2620px;margin:8px auto 0;padding:0 24px 40px;overflow-x:auto}
svg{display:block;width:100%;min-width:1900px;height:auto}
svg text{font-family:var(--sans)}
.edge,.node,.elabel{transition:opacity .2s}
svg.focus .edge:not(.on),svg.focus .node:not(.on),svg.focus .elabel:not(.on){opacity:.13}

  { id: 'nearme', name: 'Near me · position held', end: 'ok', edges: 'msg_q1 yes call wait in_dev dev_yes ln_a a_step n_tool_e n_res n_ok n_ok_R return ready_out ready_end', nodes: 's_msg s_q1 s_call p_in p_dev n_line n_a n_note n_step n_tool n_found n_okbox R n_final s_status s_ready s_end2 n_code n_store' },
  { id: 'locneeded', name: 'Near me · ask the browser', end: 'ask', edges: 'msg_q1 yes call wait in_dev dev_yes ln_none none_R return needs loc_yes browser_loop loop', nodes: 's_msg s_q1 s_call p_in p_dev n_line n_none R n_final s_status s_loc s_browser' },
  { id: 'nearme_off', name: 'Near me · not available', end: 'ask', edges: 'msg_q1 yes call wait in_dev dev_yes ln_off off_R return needs loc_no q2_yes ask_person loop', nodes: 's_msg s_q1 s_call p_in p_dev n_line n_off R n_final s_status s_loc s_q2 s_ask s_person' },
  { id: 'nearme_zero', name: 'Near me · search found nothing', end: 'ask', edges: 'msg_q1 yes call wait in_dev dev_yes ln_a a_step n_tool_e n_res n_zero n_zero_R return needs loc_no q2_yes ask_person loop', nodes: 's_msg s_q1 s_call p_in p_dev n_line n_a n_step n_tool n_found n_zerobox R n_final s_status s_loc s_q2 s_ask s_person' },
  { id: 'nearme_fail', name: 'Near me · search tool broke', end: 'bad', edges: 'msg_q1 yes call wait in_dev dev_yes ln_a a_step n_tool_e n_res n_err n_err_R return failed_out failed_end', nodes: 's_msg s_q1 s_call p_in p_dev n_line n_a n_step n_tool n_found n_failbox R n_final s_status s_failed s_end3' },
  { id: 'missing', name: 'A detail is missing', end: 'ask', edges: 'msg_q1 yes call wait in_dev dev_no fill_nulls null_yes n1_R return needs loc_no q2_yes ask_person loop', nodes: 's_msg s_q1 s_call p_in p_dev p_fill p_nulls p_n1 R n_final s_status s_loc s_q2 s_ask s_person' },
  { id: 'unknown', name: 'Area not found', end: 'ask', edges: 'msg_q1 yes call wait in_dev dev_no fill_nulls null_no geo_tool geo_res err n2_R return needs loc_no q2_yes ask_person loop', nodes: 's_msg s_q1 s_call p_in p_dev p_fill p_nulls p_geo g p_res p_n2 R n_final s_status s_loc s_q2 s_ask s_person' },
  { id: 'zero', name: 'Search found nothing', end: 'ask', edges: 'msg_q1 yes call wait in_dev dev_no fill_nulls null_no geo_tool geo_res pin srch_tool srch_res zero zero_R return needs loc_no q2_yes ask_person loop', nodes: 's_msg s_q1 s_call p_in p_dev p_fill p_nulls p_geo g p_res p_search gm p_found p_zero R n_final s_status s_loc s_q2 s_ask s_person' },
  { id: 'three', name: 'Asked 3 times', end: 'bad', edges: 'msg_q1 yes call wait in_dev dev_no fill_nulls null_yes n1_R return needs loc_no q2_no limit_end', nodes: 's_msg s_q1 s_call p_in p_dev p_fill p_nulls p_n1 R n_final s_status s_loc s_q2 s_limit s_end4' },
  { id: 'problem', name: 'Search tool broke', end: 'bad', edges: 'msg_q1 yes call wait in_dev dev_no fill_nulls null_no geo_tool geo_res pin srch_tool srch_res serr fail_R return failed_out failed_end', nodes: 's_msg s_q1 s_call p_in p_dev p_fill p_nulls p_geo g p_res p_search gm p_found p_fail R n_final s_status s_failed s_end3' },
  { id: 'notplace', name: 'Not a place request', end: 'neutral', edges: 'msg_q1 no chat_end', nodes: 's_msg s_q1 s_chat s_end1' }
];

// ---------- drawing ----------
const defs = mk('defs');
for (const [k, c] of Object.entries(EDGE)) {
  const m = mk('marker', { id: 'ar-' + k, viewBox: '0 0 10 10', refX: 8.5, refY: 5, markerWidth: 7.5, markerHeight: 7.5, orient: 'auto-start-reverse' }, defs);
  mk('path', { d: 'M1 1 L9 5 L1 9 z', fill: c }, m);
}
const H = 2830;
LANES.forEach(l => {
  mk('rect', { x: l.x, y: 20, width: l.w, height: H - 50, rx: 24, fill: 'rgba(255,255,255,.6)', stroke: '#e2e8f0' });
  const t = mk('text', { x: l.x + 26, y: 56, 'font-size': 21, 'font-weight': 600, fill: '#334155', 'font-family': 'Spectral, Georgia, serif' }, svg, l.title);
  const fw = width(l.file, F.chip) + 18, fx = l.x + 26 + width(l.title, '600 21px Spectral, Georgia, serif') + 14;
  mk('rect', { x: fx, y: 38, width: fw, height: 24, rx: 12, fill: '#d0fae5', stroke: '#a7ebcd' });
  mk('text', { x: fx + fw / 2, y: 54, 'text-anchor': 'middle', 'font-size': 11.5, 'font-family': 'IBM Plex Mono, monospace', fill: '#10676f' }, svg, l.file);
});

const node = Object.fromEntries(NODES.map(n => [n.id, n]));
const edgeLayer = mk('g'), nodeLayer = mk('g'), labelLayer = mk('g');

function roundedPath(pts, r = 12) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [cx, cy] = pts[i], [nx, ny] = pts[i + 1];
    const l1 = Math.hypot(cx - px, cy - py), l2 = Math.hypot(nx - cx, ny - cy), rr = Math.min(r, l1 / 2, l2 / 2);
    const ax = cx - (cx - px) / l1 * rr, ay = cy - (cy - py) / l1 * rr, bx = cx + (nx - cx) / l2 * rr, by = cy + (ny - cy) / l2 * rr;
    d += ` L${ax} ${ay} Q${cx} ${cy} ${bx} ${by}`;
  }
  const [lx, ly] = pts[pts.length - 1]; return d + ` L${lx} ${ly}`;
}
function drawEdge(e) {
  const tone = e.tone || 'neutral', g = mk('g', { class: 'edge', 'data-e': e.id }, edgeLayer);
  const attrs = { d: roundedPath(e.pts), fill: 'none', stroke: EDGE[tone], 'stroke-width': e.bold ? 3 : 2.4, 'stroke-linecap': 'round', 'marker-end': `url(#ar-${tone})` };
  if (e.both) attrs['marker-start'] = `url(#ar-${tone})`;
  if (e.dashed) attrs['stroke-dasharray'] = '7 6';
  mk('path', attrs, g);
  (e.labels || (e.label ? [e.label] : [])).forEach(([text, x, y]) => {
    const lg = mk('g', { class: 'elabel', 'data-e': e.id }, labelLayer), w = width(text, F.label) + 18;
    mk('rect', { x: x - w / 2, y: y - 12, width: w, height: 24, rx: 12, fill: '#fff', stroke: EDGE[tone], 'stroke-width': 1.6 }, lg);
    mk('text', { x, y: y + 4.2, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 600, fill: tone === 'neutral' ? '#334155' : TONE[tone].ink }, lg, text);
  });
}

function chipRows(chips, maxW) {
  const rows = []; let row = [], used = 0;
  chips.forEach(([t, tone]) => {
    const w = width(t, F.chip) + 18;
    if (row.length && used + w + 6 > maxW) { rows.push(row); row = []; used = 0; }
    row.push({ t, tone: tone || 'neutral', w }); used += w + (row.length > 1 ? 6 : 0);
  });
  if (row.length) rows.push(row); return rows;
}
function drawNode(n) {
  const g = mk('g', { class: 'node', 'data-n': n.id }, nodeLayer), t = TONE[n.tone || 'neutral'];
  const x = n.cx - n.w / 2, y = n.cy - n.h / 2;
  if (n.kind === 'diamond') {
    mk('polygon', { points: `${n.cx},${y} ${n.cx + n.w / 2},${n.cy} ${n.cx},${y + n.h} ${x},${n.cy}`, fill: '#f0fdf9', stroke: '#10676f', 'stroke-width': 2 }, g);
    const lines = n.title, top = n.cy - (lines.length - 1) * 9;
    lines.forEach((ln, i) => mk('text', { x: n.cx, y: top + i * 18 + 5, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 600, fill: '#10676f' }, g, ln));
    return;
  }
  if (n.kind === 'tag') {
    mk('rect', { x, y, width: n.w, height: n.h, rx: 8, fill: t.fill, stroke: t.stroke, 'stroke-dasharray': '4 3' }, g);
    mk('text', { x: n.cx, y: n.cy + 4.5, 'text-anchor': 'middle', 'font-size': 12.5, 'font-weight': 500, fill: t.ink }, g, n.title); return;
  }
  const r = n.kind === 'pill' ? n.h / 2 : n.kind === 'tool' ? 12 : 16;
  mk('rect', { x, y, width: n.w, height: n.h, rx: r, fill: t.fill, stroke: t.stroke, 'stroke-width': n.tone && n.tone !== 'neutral' && n.tone !== 'dark' ? 1.8 : 1.5 }, g);
  const rows = n.chips ? chipRows(n.chips, n.w - 24) : [];
  const parts = [];
  if (n.badge) parts.push({ type: 'badge', h: 22 });
  if (n.title) parts.push({ type: 'title', h: 20 });
  rows.forEach(rw => parts.push({ type: 'chips', h: 24, row: rw }));
  const total = parts.reduce((s, p) => s + p.h, 0) + (parts.length - 1) * 6;
  if (total > n.h - 14) console.warn('node content overflows:', n.id, total, n.h);
  let cy = n.cy - total / 2;
  parts.forEach(p => {
    const mid = cy + p.h / 2;
    if (p.type === 'badge') {
      const [bt, tone] = n.badge, w = width(bt, F.badge) + 20;
      mk('rect', { x: n.cx - w / 2, y: mid - 10, width: w, height: 20, rx: 10, fill: EDGE[tone] }, g);
      mk('text', { x: n.cx, y: mid + 3.8, 'text-anchor': 'middle', 'font-size': 10.5, 'font-weight': 600, 'font-family': 'IBM Plex Mono, monospace', fill: '#fff', 'letter-spacing': .5 }, g, bt.toUpperCase());
    } else if (p.type === 'title') {
      mk('text', { x: n.cx, y: mid + 5, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 600, fill: t.ink }, g, n.title);
    } else {
      const total = p.row.reduce((s, c) => s + c.w, 0) + (p.row.length - 1) * 6; let x0 = n.cx - total / 2;
      p.row.forEach(c => {
        const [bg, fg] = CHIP[c.tone];
        mk('rect', { x: x0, y: mid - 11, width: c.w, height: 22, rx: 11, fill: bg }, g);
        mk('text', { x: x0 + c.w / 2, y: mid + 4, 'text-anchor': 'middle', 'font-size': 11.5, 'font-family': 'IBM Plex Mono, monospace', 'font-weight': 500, fill: fg }, g, c.t);
        x0 += c.w + 6;
      });
    }
    cy += p.h + 6;
  });
}
EDGES.forEach(drawEdge);
NODES.forEach(drawNode);
// the dashed link that ties the "never guess" stamps to the fill step
mk('path', { d: 'M1320 715 L1372 715', stroke: '#fb7185', 'stroke-width': 1.6, 'stroke-dasharray': '4 3', fill: 'none' }, edgeLayer);

// ---------- legend and path buttons ----------
const legend = document.getElementById('legend');
const lg = (cls, label, style = '') => { const s = document.createElement('span'); s.innerHTML = `<i class="${cls}" style="${style}"></i>${label}`; legend.append(s); };
lg('lg-line', 'ready', 'border-color:#18aa7e'); lg('lg-line', 'needs_input', 'border-color:#d97706'); lg('lg-line', 'failed / stop', 'border-color:#e11d48'); lg('lg-line', 'neutral', 'border-color:#94a3b8');
legend.append(Object.assign(document.createElement('i'), { className: 'sep' }));
lg('lg-shape lg-dia', 'decision'); lg('lg-shape lg-box', 'action'); lg('lg-shape lg-pill', 'start / end'); lg('lg-shape lg-tool', 'tool'); lg('lg-line dash', 'waiting / tool call', 'border-color:#64748b');

const box = document.getElementById('paths'); box.append(Object.assign(document.createElement('span'), { className: 'lead', textContent: 'FOLLOW A PATH' }));
let current = null;
function select(id) {
  current = current === id ? null : id;
  const p = PATHS.find(x => x.id === current), eds = p ? p.edges.split(' ') : [], nds = p ? p.nodes.split(' ') : [];
  svg.classList.toggle('focus', !!p);
  svg.querySelectorAll('[data-e]').forEach(el => el.classList.toggle('on', eds.includes(el.dataset.e)));
  svg.querySelectorAll('[data-n]').forEach(el => el.classList.toggle('on', nds.includes(el.dataset.n)));
  box.querySelectorAll('.pbtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === current)));
}
PATHS.forEach((p, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'pbtn'; b.dataset.id = p.id; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<i class="dot ${p.end}"></i>${i + 1}. ${p.name}`; b.addEventListener('click', () => select(p.id)); box.append(b);
});
const reset = document.createElement('button'); reset.type = 'button'; reset.className = 'pbtn reset'; reset.textContent = 'Show all'; reset.addEventListener('click', () => { current = 'x'; select('x'); }); box.append(reset);
})();
</script>
