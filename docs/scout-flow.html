<style>

header{max-width:1760px;margin:0 auto;padding:26px 24px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}

h1{margin:4px 0 0;font:600 34px/1.1 var(--serif);color:var(--ink);letter-spacing:-.5px}
.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font:500 12px var(--sans);color:var(--ink)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.lg-line{width:30px;height:0;border-top:3px solid}
.lg-line.dash{border-top-style:dashed}
.lg-shape{width:20px;height:14px;border:1.5px solid var(--faint);background:#fff}
.lg-pill{border-radius:99px;background:#334155;border-color:#334155}
.lg-box{border-radius:5px}
.lg-dia{width:15px;height:15px;transform:rotate(45deg);border-color:var(--brand-deep);background:#f0fdf9;margin:0 3px}
.lg-tool{border-radius:5px;background:#1e293b;border-color:#1e293b}
.sep{width:1px;height:20px;background:var(--line)}
.paths{max-width:1760px;margin:0 auto;padding:14px 24px 6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.paths .lead{font:500 11px var(--mono);letter-spacing:1.2px;color:var(--muted);margin-right:4px}
.pbtn{display:inline-flex;align-items:center;gap:9px;font:500 13px var(--sans);color:var(--ink);background:#fff;border:1px solid var(--faint);border-radius:999px;padding:6px 14px 6px 10px;cursor:pointer}
.pbtn:hover{background:#f1f5f9}
.pbtn[aria-pressed=true]{background:var(--mint);border-color:var(--brand);color:var(--brand-deep)}
.pbtn:focus-visible{outline:3px solid #5ae8bd;outline-offset:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.ok{background:var(--brand)}.dot.ask{background:var(--amber)}.dot.bad{background:var(--rose)}.dot.neutral{background:#94a3b8}
.pbtn.reset{border-style:dashed;color:var(--muted)}
.stage{max-width:1760px;margin:8px auto 0;padding:0 24px 40px;overflow-x:auto}
svg{display:block;width:100%;min-width:1400px;height:auto}
svg text{font-family:var(--sans)}
.edge,.node,.elabel{transition:opacity .2s}
svg.focus .edge:not(.on),svg.focus .node:not(.on),svg.focus .elabel:not(.on){opacity:.13}
svg.focus .edge.on path{stroke-width:3.6}
@media(prefers-reduced-motion:reduce){.edge,.node,.elabel{transition:none}}

<script>
(async () => {
const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('flow');
const mk = (tag, attrs = {}, parent = svg, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; parent.append(e); return e; };
try { await document.fonts.ready; } catch (e) { /* system fonts are measured instead */ }
const ctx = document.createElement('canvas').getContext('2d');
const width = (t, font) => { ctx.font = font; return ctx.measureText(t).width; };
const F = { title: '600 14px Inter, sans-serif', chip: '500 11.5px "IBM Plex Mono", monospace', badge: '600 10.5px "IBM Plex Mono", monospace', label: '600 12px Inter, sans-serif' };

const TONE = {
  neutral: { fill: '#ffffff', stroke: '#cbd5e1', ink: '#334155' },
  ok:      { fill: '#ecfdf5', stroke: '#34d399', ink: '#0f6b4f' },
  ask:     { fill: '#fffbeb', stroke: '#f59e0b', ink: '#92400e' },
  bad:     { fill: '#fff1f2', stroke: '#fb7185', ink: '#be123c' },
  dark:    { fill: '#334155', stroke: '#334155', ink: '#ffffff' },
  tool:    { fill: '#1e293b', stroke: '#1e293b', ink: '#ffffff' }
};
const EDGE = { neutral: '#94a3b8', ok: '#18aa7e', ask: '#d97706', bad: '#e11d48' };
const CHIP = { neutral: ['#f1f5f9', '#334155'], tool: ['#334155', '#ffffff'], ok: ['#d0fae5', '#0f6b4f'], ask: ['#fef3c7', '#92400e'], bad: ['#ffe4e6', '#be123c'] };

// ---------- the flow, taken from prompts/coordinator.md and prompts/scout.md ----------
const LANES = [
  { x: 20, w: 810, title: 'COORDINATOR', file: 'coordinator.md' },
  { x: 880, w: 860, title: 'SCOUT AGENT', file: 'scout.md' }
];
const NODES = [
  // ---- Coordinator (coordinator.md)
  { id: 's_msg', kind: 'pill', tone: 'dark', cx: 480, cy: 105, w: 280, h: 46, title: 'Person sends a message' },
  { id: 's_q1', kind: 'diamond', cx: 480, cy: 235, w: 310, h: 120, title: ['Is it a request', 'to find a place?'] },
  { id: 's_chat', cx: 170, cy: 362, w: 250, h: 96, title: 'Reply in 1 sentence', chips: [['says what it can do'], ['no tool called', 'bad']] },
  { id: 's_end1', kind: 'pill', tone: 'dark', cx: 170, cy: 484, w: 120, h: 38, title: 'Done' },
  { id: 's_call', cx: 480, cy: 385, w: 340, h: 104, title: 'Say 1 sentence, then call', chips: [['scout_agent', 'tool'], ['request + all answers so far']] },
  { id: 's_rules', cx: 230, cy: 700, w: 400, h: 168, tone: 'bad', title: 'Coordinator never', chips: [['decides what is missing'], ['asks its own questions'], ['invents coordinates, places, phones']] },
  { id: 's_status', cx: 400, cy: 1352, w: 500, h: 64, title: 'Read the status the scout agent returned' },
  { id: 's_ready', cx: 190, cy: 1492, w: 210, h: 128, tone: 'ok', badge: ['ready', 'ok'], title: 'Reply in 2 short sentences', chips: [['what is prepared'], ['search tool runs next']] },
  { id: 's_end2', kind: 'pill', tone: 'dark', cx: 190, cy: 1600, w: 120, h: 38, title: 'Done' },
  { id: 's_failed', cx: 690, cy: 1492, w: 190, h: 100, tone: 'bad', badge: ['failed', 'bad'], title: 'Tell the problem', chips: [['1 sentence']] },
  { id: 's_end3', kind: 'pill', tone: 'dark', cx: 690, cy: 1600, w: 120, h: 38, title: 'Done' },
  { id: 's_q2', kind: 'diamond', cx: 470, cy: 1690, w: 270, h: 124, title: ['ask_user used', 'fewer than 3 times?'] },

  { id: 's_person', kind: 'pill', tone: 'ask', cx: 470, cy: 1982, w: 260, h: 54, title: 'Person answers' },
  // ---- Scout agent (scout.md)
  { id: 'p_in', kind: 'pill', tone: 'dark', cx: 1130, cy: 365, w: 320, h: 56, title: 'Request + earlier answers' },
  { id: 'p_fill', cx: 1130, cy: 485, w: 380, h: 120, title: 'Fill from what was actually said', chips: [['business_type'], ['area'], ['city'], ['null if not stated', 'ask']] },
  { id: 'p_t1', kind: 'tag', tone: 'bad', cx: 1530, cy: 440, w: 310, h: 32, title: '✗  “near me” / “nearby” is not an area' },
  { id: 'p_t2', kind: 'tag', tone: 'bad', cx: 1530, cy: 485, w: 310, h: 32, title: '✗  a city alone is not an area' },
  { id: 'p_t3', kind: 'tag', tone: 'bad', cx: 1530, cy: 530, w: 310, h: 32, title: '✗  an area alone is not a city' },
  { id: 'p_nulls', kind: 'diamond', cx: 1130, cy: 670, w: 340, h: 130, title: ['Is any of the 3', 'details null?'] },
  { id: 'p_n1', cx: 1005, cy: 852, w: 230, h: 140, tone: 'ask', badge: ['needs_input', 'ask'], title: 'geocode is NOT called', chips: [['missing = the null ones'], ['question: 1 short sentence']] },
  { id: 'p_geo', cx: 1340, cy: 830, w: 280, h: 110, title: 'Call geocode once', chips: [['area + city'], ['country only if not India']] },
  { id: 'g', kind: 'tool', tone: 'tool', cx: 1650, cy: 830, w: 170, h: 70, title: 'geocode', chips: [['Google Maps', 'tool']] },
  { id: 'p_res', kind: 'diamond', cx: 1340, cy: 990, w: 340, h: 130, title: ['What did geocode', 'return?'] },
  { id: 'p_ready', cx: 1190, cy: 1183, w: 230, h: 184, tone: 'ok', badge: ['ready', 'ok'], title: 'args', chips: [['query “<biz> in <Area> <City>”'], ['lat, lng ← geocode only'], ['radius_m null | 2000'], ['lang “en”']] },
  { id: 'p_n2', cx: 1625, cy: 1181, w: 220, h: 180, tone: 'ask', badge: ['needs_input', 'ask'], title: 'geocode is NOT called again', chips: [['missing = [area]'], ['ask: another spelling'], ['or a nearby landmark']] },
  { id: 'p_fail', cx: 1400, cy: 1155, w: 150, h: 110, tone: 'bad', badge: ['failed', 'bad'], chips: [['problem = …'], ['from any step']] },
  { id: 'R', cx: 1330, cy: 1352, w: 740, h: 100, title: 'Return the result to the coordinator', chips: [['status', 'tool'], ['business_type'], ['area'], ['city'], ['missing'], ['question'], ['args'], ['problem']] }
];
// pts are absolute; tone colours the edge by the outcome it leads to
const EDGES = [
  { id: 'msg_q1', pts: [[480, 128], [480, 175]] },
  { id: 'no', pts: [[325, 235], [170, 235], [170, 314]], label: ['NO · not a place request', 250, 212] },
  { id: 'chat_end', pts: [[170, 410], [170, 465]] },
  { id: 'yes', pts: [[480, 295], [480, 333]], label: ['YES', 520, 314] },
  { id: 'call', pts: [[650, 365], [976, 365]], label: ['scout_agent( request + all answers )', 815, 343], tone: 'neutral', bold: true },
  { id: 'wait', pts: [[480, 437], [480, 1318]], dashed: true, label: ['Coordinator waits for the scout agent', 480, 900] },
  { id: 'in_fill', pts: [[1130, 393], [1130, 425]] },
  { id: 'fill_nulls', pts: [[1130, 545], [1130, 605]] },
  { id: 'null_yes', pts: [[960, 670], [940, 670], [940, 782]], tone: 'ask', label: ['YES · a detail is null', 1040, 748] },
  { id: 'null_no', pts: [[1130, 735], [1130, 756], [1340, 756], [1340, 775]], label: ['NO · all three known', 1262, 738] },
  { id: 'geo_tool', pts: [[1480, 830], [1565, 830]], dashed: true, both: true, labels: [['area, city', 1522, 806], ['pin | error', 1522, 856]] },
  { id: 'geo_res', pts: [[1340, 885], [1340, 925]] },
  { id: 'pin', pts: [[1170, 990], [1150, 990], [1150, 1091]], tone: 'ok', label: ['A PIN', 1108, 968] },
  { id: 'err', pts: [[1510, 990], [1625, 990], [1625, 1091]], tone: 'ask', label: ['ERROR', 1568, 968] },
  { id: 'unexp', pts: [[1340, 1055], [1340, 1078], [1400, 1078], [1400, 1100]], tone: 'bad', dashed: true, label: ['unexpected problem', 1245, 1070] },
  { id: 'n1_R', pts: [[1005, 922], [1005, 1301]], tone: 'ask' },
  { id: 'ready_R', pts: [[1190, 1275], [1190, 1301]], tone: 'ok' },
  { id: 'fail_R', pts: [[1400, 1210], [1400, 1301]], tone: 'bad' },
  { id: 'n2_R', pts: [[1625, 1271], [1625, 1301]], tone: 'ask' },
  { id: 'return', pts: [[960, 1352], [652, 1352]], bold: true, label: ['result { status, … }', 890, 1330] },
  { id: 'ready_out', pts: [[190, 1384], [190, 1428]], tone: 'ok', label: ['status = ready', 190, 1406] },
  { id: 'needs', pts: [[470, 1384], [470, 1628]], tone: 'ask', label: ['status = needs_input', 470, 1420] },
  { id: 'failed_out', pts: [[610, 1384], [610, 1442]], tone: 'bad', label: ['status = failed', 662, 1409] },
  { id: 'ready_end', pts: [[190, 1556], [190, 1581]], tone: 'ok' },
  { id: 'failed_end', pts: [[690, 1542], [690, 1581]], tone: 'bad' },
  { id: 'q2_yes', pts: [[470, 1752], [470, 1790]], tone: 'ask', label: ['YES · asked 0, 1 or 2 times', 600, 1771] },
  { id: 'q2_no', pts: [[335, 1690], [150, 1690], [150, 1760]], tone: 'bad', label: ['NO · asked 3 times', 238, 1668] },
  { id: 'ask_person', pts: [[470, 1894], [470, 1955]], tone: 'ask' },
  { id: 'loop', pts: [[600, 1982], [805, 1982], [805, 417], [652, 417]], tone: 'ask', label: ['call scout_agent again · request + the answer', 805, 1140] },
  { id: 'limit_end', pts: [[150, 1852], [150, 1901]], tone: 'bad' }
];
const PATHS = [
  { id: 'happy', name: 'All details given', end: 'ok', edges: 'msg_q1 yes call wait in_fill fill_nulls null_no geo_tool geo_res pin ready_R return ready_out ready_end', nodes: 's_msg s_q1 s_call p_in p_fill p_nulls p_geo g p_res p_ready R s_status s_ready s_end2' },
  { id: 'missing', name: 'A detail is missing', end: 'ask', edges: 'msg_q1 yes call wait in_fill fill_nulls null_yes n1_R return needs q2_yes ask_person loop', nodes: 's_msg s_q1 s_call p_in p_fill p_nulls p_n1 R s_status s_q2 s_ask s_person' },
  { id: 'unknown', name: 'Area not found', end: 'ask', edges: 'msg_q1 yes call wait in_fill fill_nulls null_no geo_tool geo_res err n2_R return needs q2_yes ask_person loop', nodes: 's_msg s_q1 s_call p_in p_fill p_nulls p_geo g p_res p_n2 R s_status s_q2 s_ask s_person' },
  { id: 'three', name: 'Asked 3 times', end: 'bad', edges: 'msg_q1 yes call wait in_fill fill_nulls null_yes n1_R return needs q2_no limit_end', nodes: 's_msg s_q1 s_call p_in p_fill p_nulls p_n1 R s_status s_q2 s_limit s_end4' },
  { id: 'problem', name: 'Unexpected problem', end: 'bad', edges: 'msg_q1 yes call wait in_fill fill_nulls null_no geo_tool geo_res unexp fail_R return failed_out failed_end', nodes: 's_msg s_q1 s_call p_in p_fill p_nulls p_geo g p_res p_fail R s_status s_failed s_end3' },
  { id: 'notplace', name: 'Not a place request', end: 'neutral', edges: 'msg_q1 no chat_end', nodes: 's_msg s_q1 s_chat s_end1' }
];

// ---------- drawing ----------
const defs = mk('defs');
for (const [k, c] of Object.entries(EDGE)) {
  const m = mk('marker', { id: 'ar-' + k, viewBox: '0 0 10 10', refX: 8.5, refY: 5, markerWidth: 7.5, markerHeight: 7.5, orient: 'auto-start-reverse' }, defs);
  mk('path', { d: 'M1 1 L9 5 L1 9 z', fill: c }, m);
}
const H = 2070;
LANES.forEach(l => {
  mk('rect', { x: l.x, y: 20, width: l.w, height: H - 50, rx: 24, fill: 'rgba(255,255,255,.6)', stroke: '#e2e8f0' });
  const t = mk('text', { x: l.x + 26, y: 56, 'font-size': 21, 'font-weight': 600, fill: '#334155', 'font-family': 'Spectral, Georgia, serif' }, svg, l.title);
  const fw = width(l.file, F.chip) + 18, fx = l.x + 26 + width(l.title, '600 21px Spectral, Georgia, serif') + 14;
  mk('rect', { x: fx, y: 38, width: fw, height: 24, rx: 12, fill: '#d0fae5', stroke: '#a7ebcd' });
  mk('text', { x: fx + fw / 2, y: 54, 'text-anchor': 'middle', 'font-size': 11.5, 'font-family': 'IBM Plex Mono, monospace', fill: '#10676f' }, svg, l.file);
});

const node = Object.fromEntries(NODES.map(n => [n.id, n]));
const edgeLayer = mk('g'), nodeLayer = mk('g'), labelLayer = mk('g');

function roundedPath(pts, r = 12) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [cx, cy] = pts[i], [nx, ny] = pts[i + 1];
    const l1 = Math.hypot(cx - px, cy - py), l2 = Math.hypot(nx - cx, ny - cy), rr = Math.min(r, l1 / 2, l2 / 2);
    const ax = cx - (cx - px) / l1 * rr, ay = cy - (cy - py) / l1 * rr, bx = cx + (nx - cx) / l2 * rr, by = cy + (ny - cy) / l2 * rr;
    d += ` L${ax} ${ay} Q${cx} ${cy} ${bx} ${by}`;
  }
  const [lx, ly] = pts[pts.length - 1]; return d + ` L${lx} ${ly}`;
}
function drawEdge(e) {
  const tone = e.tone || 'neutral', g = mk('g', { class: 'edge', 'data-e': e.id }, edgeLayer);
  const attrs = { d: roundedPath(e.pts), fill: 'none', stroke: EDGE[tone], 'stroke-width': e.bold ? 3 : 2.4, 'stroke-linecap': 'round', 'marker-end': `url(#ar-${tone})` };
  if (e.both) attrs['marker-start'] = `url(#ar-${tone})`;
  if (e.dashed) attrs['stroke-dasharray'] = '7 6';
  mk('path', attrs, g);
  (e.labels || (e.label ? [e.label] : [])).forEach(([text, x, y]) => {
    const lg = mk('g', { class: 'elabel', 'data-e': e.id }, labelLayer), w = width(text, F.label) + 18;
    mk('rect', { x: x - w / 2, y: y - 12, width: w, height: 24, rx: 12, fill: '#fff', stroke: EDGE[tone], 'stroke-width': 1.6 }, lg);
    mk('text', { x, y: y + 4.2, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 600, fill: tone === 'neutral' ? '#334155' : TONE[tone].ink }, lg, text);
  });
}

function chipRows(chips, maxW) {
  const rows = []; let row = [], used = 0;
  chips.forEach(([t, tone]) => {
    const w = width(t, F.chip) + 18;
    if (row.length && used + w + 6 > maxW) { rows.push(row); row = []; used = 0; }
    row.push({ t, tone: tone || 'neutral', w }); used += w + (row.length > 1 ? 6 : 0);
  });
  if (row.length) rows.push(row); return rows;
}
function drawNode(n) {
  const g = mk('g', { class: 'node', 'data-n': n.id }, nodeLayer), t = TONE[n.tone || 'neutral'];
  const x = n.cx - n.w / 2, y = n.cy - n.h / 2;
  if (n.kind === 'diamond') {
    mk('polygon', { points: `${n.cx},${y} ${n.cx + n.w / 2},${n.cy} ${n.cx},${y + n.h} ${x},${n.cy}`, fill: '#f0fdf9', stroke: '#10676f', 'stroke-width': 2 }, g);
    const lines = n.title, top = n.cy - (lines.length - 1) * 9;
    lines.forEach((ln, i) => mk('text', { x: n.cx, y: top + i * 18 + 5, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 600, fill: '#10676f' }, g, ln));
    return;
  }
  if (n.kind === 'tag') {
    mk('rect', { x, y, width: n.w, height: n.h, rx: 8, fill: t.fill, stroke: t.stroke, 'stroke-dasharray': '4 3' }, g);
    mk('text', { x: n.cx, y: n.cy + 4.5, 'text-anchor': 'middle', 'font-size': 12.5, 'font-weight': 500, fill: t.ink }, g, n.title); return;
  }
  const r = n.kind === 'pill' ? n.h / 2 : n.kind === 'tool' ? 12 : 16;
  mk('rect', { x, y, width: n.w, height: n.h, rx: r, fill: t.fill, stroke: t.stroke, 'stroke-width': n.tone && n.tone !== 'neutral' && n.tone !== 'dark' ? 1.8 : 1.5 }, g);
  const rows = n.chips ? chipRows(n.chips, n.w - 24) : [];
  const parts = [];
  if (n.badge) parts.push({ type: 'badge', h: 22 });
  if (n.title) parts.push({ type: 'title', h: 20 });
  rows.forEach(rw => parts.push({ type: 'chips', h: 24, row: rw }));
  const total = parts.reduce((s, p) => s + p.h, 0) + (parts.length - 1) * 6;
  if (total > n.h - 14) console.warn('node content overflows:', n.id, total, n.h);
  let cy = n.cy - total / 2;
  parts.forEach(p => {
    const mid = cy + p.h / 2;
    if (p.type === 'badge') {
      const [bt, tone] = n.badge, w = width(bt, F.badge) + 20;
      mk('rect', { x: n.cx - w / 2, y: mid - 10, width: w, height: 20, rx: 10, fill: EDGE[tone] }, g);
      mk('text', { x: n.cx, y: mid + 3.8, 'text-anchor': 'middle', 'font-size': 10.5, 'font-weight': 600, 'font-family': 'IBM Plex Mono, monospace', fill: '#fff', 'letter-spacing': .5 }, g, bt.toUpperCase());
    } else if (p.type === 'title') {
      mk('text', { x: n.cx, y: mid + 5, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 600, fill: t.ink }, g, n.title);
    } else {
      const total = p.row.reduce((s, c) => s + c.w, 0) + (p.row.length - 1) * 6; let x0 = n.cx - total / 2;
      p.row.forEach(c => {
        const [bg, fg] = CHIP[c.tone];
        mk('rect', { x: x0, y: mid - 11, width: c.w, height: 22, rx: 11, fill: bg }, g);
        mk('text', { x: x0 + c.w / 2, y: mid + 4, 'text-anchor': 'middle', 'font-size': 11.5, 'font-family': 'IBM Plex Mono, monospace', 'font-weight': 500, fill: fg }, g, c.t);
        x0 += c.w + 6;
      });
    }
    cy += p.h + 6;
  });
}
EDGES.forEach(drawEdge);
NODES.forEach(drawNode);
// the dashed link that ties the "never guess" stamps to the fill step
mk('path', { d: 'M1320 485 L1372 485', stroke: '#fb7185', 'stroke-width': 1.6, 'stroke-dasharray': '4 3', fill: 'none' }, edgeLayer);

// ---------- legend and path buttons ----------
const legend = document.getElementById('legend');
const lg = (cls, label, style = '') => { const s = document.createElement('span'); s.innerHTML = `<i class="${cls}" style="${style}"></i>${label}`; legend.append(s); };
lg('lg-line', 'ready', 'border-color:#18aa7e'); lg('lg-line', 'needs_input', 'border-color:#d97706'); lg('lg-line', 'failed / stop', 'border-color:#e11d48'); lg('lg-line', 'neutral', 'border-color:#94a3b8');
legend.append(Object.assign(document.createElement('i'), { className: 'sep' }));
lg('lg-shape lg-dia', 'decision'); lg('lg-shape lg-box', 'action'); lg('lg-shape lg-pill', 'start / end'); lg('lg-shape lg-tool', 'tool'); lg('lg-line dash', 'waiting / tool call', 'border-color:#64748b');

const box = document.getElementById('paths'); box.append(Object.assign(document.createElement('span'), { className: 'lead', textContent: 'FOLLOW A PATH' }));
let current = null;
function select(id) {
  current = current === id ? null : id;
  const p = PATHS.find(x => x.id === current), eds = p ? p.edges.split(' ') : [], nds = p ? p.nodes.split(' ') : [];
  svg.classList.toggle('focus', !!p);
  svg.querySelectorAll('[data-e]').forEach(el => el.classList.toggle('on', eds.includes(el.dataset.e)));
  svg.querySelectorAll('[data-n]').forEach(el => el.classList.toggle('on', nds.includes(el.dataset.n)));
  box.querySelectorAll('.pbtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === current)));
}
PATHS.forEach((p, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'pbtn'; b.dataset.id = p.id; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<i class="dot ${p.end}"></i>${i + 1}. ${p.name}`; b.addEventListener('click', () => select(p.id)); box.append(b);
});
const reset = document.createElement('button'); reset.type = 'button'; reset.className = 'pbtn reset'; reset.textContent = 'Show all'; reset.addEventListener('click', () => { current = 'x'; select('x'); }); box.append(reset);
})();
</script>
</body></html>
