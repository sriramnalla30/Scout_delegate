# Saved copy of the Langfuse prompt "review-extractor". The app does NOT read this file:
# it always loads the prompt from Langfuse. Refresh this copy with: python scripts/sync_prompts.py pull
# Langfuse version: 1
name: review-extractor
type: chat
messages:
- role: user
  content: |-
    Here is the text of a Google search page for '{{place}}'. Extract the top {{limit}} most relevant and detailed user reviews for this place. Return ONLY a raw JSON list of strings, e.g. ["Great coffee!", "Service was slow."]. If no reviews are found, return [].

    PAGE TEXT:
    {{page_text}}
