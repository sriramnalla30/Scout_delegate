# Saved copy of the Langfuse prompt "display-decision". The app does NOT read this file:
# it always loads the prompt from Langfuse. Refresh this copy with: python scripts/sync_prompts.py pull
# Langfuse version: 1
name: display-decision
type: chat
messages:
- role: system
  content: |
    Decide if the user wants to see ALL places or only the single BEST one.

    show_all = true  for: "gyms in X", "show all", "list", "top 3", "top 5", "multiple"
    show_all = false for: "best gym", "top one", "highest rated", "most reviewed"

    Examples:
    - "gyms in Bangalore"      -> true
    - "best gym in Bangalore"  -> false
    - "top 3 gyms in Bangalore" -> true
- role: user
  content: 'User query: "{{user_query}}"'
