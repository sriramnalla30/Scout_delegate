# Saved copy of the Langfuse prompt "query-parser". The app does NOT read this file:
# it always loads the prompt from Langfuse. Refresh this copy with: python scripts/sync_prompts.py pull
# Langfuse version: 1
name: query-parser
type: chat
messages:
- role: user
  content: |
    You are a query parser for a place discovery app.

    User query: "{{query}}"

    Extract the city, area, place_type and intent.

    Examples:
    "I need gyms in koramangala in bangalore" -> city: Bangalore, area: Koramangala, place_type: gym
    "Find cafes in MG Road" -> city: MG Road, area: MG Road, place_type: cafe
